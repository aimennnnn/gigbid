[project]
name = "gigbid"
version = "0.1.0"
description = "GigBid: a multi-agent freelancer copilot (AI-4016 R&D assignment)"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "langgraph==1.2.22",
    "fastapi==0.162.7",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
    "rank-bm25>=0.2.2",
    "pytest-asyncio>=1.5.0",
    "mcp>=1.24,<2",
    "langchain-mcp-adapters==0.3.2",
    "python-dotenv>=1.2.4",
    "fastembed>=0.9.1",
    "numpy>=2.4.6",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langgraph-supervisor>=0.0.31",
    "langchain-openai>=1.8.0",
]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "mcp_servers"]
markers = ["persist: run the API with its on-disk stores (the restart test)"]

[tool.ruff]
line-length = 110
extend-exclude = ["gigsim", "data"]
