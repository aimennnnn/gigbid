# GigBid configuration. Everything that might change lives here, not in code:
# which model each agent uses, the budgets, the bid/skip thresholds and the
# marketplace rules. A "platform policy update" should only need edits in this file.

profile: open            # open | paid   (override with env GIGBID_PROFILE)
marketplace: gigsim      # gigsim | upwork (override with env GIGBID_MARKETPLACE)

profiles:
  # Required profile: open-weight models only. The deployed link runs on this one.
  open:
    name: groq                           # hosted open-model provider (free tier)
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    models:
      small: openai/gpt-oss-20b          # cheap, frequent nodes
      strong: openai/gpt-oss-120b        # writer, critic, liaison
      fallback: openai/gpt-oss-20b       # used when a cheap node's model fails
    tpm_limit: 8000                    # provider's tokens-per-minute cap per model (Groq free tier); 0 = no pacing
    extra: {reasoning_effort: low}     # sent with every request: less hidden reasoning, fewer tokens
    # More open-model capacity. Tried in order when the provider above is rate limited.
    # A provider whose key (or URL) is not set in .env is skipped.
    backup_providers:
      - name: openrouter
        base_url: https://openrouter.ai/api/v1
        api_key_env: OPENROUTER_API_KEY
        tpm_limit: 0
        extra: {}
        models: {small: "openai/gpt-oss-20b:free", strong: "openai/gpt-oss-120b:free", fallback: "openai/gpt-oss-20b:free"}   # ":free" = no credit needed
      - name: ollama                     # a local model, or a free Colab/Kaggle GPU: no key, no rate limit
        base_url_env: OLLAMA_URL         # e.g. http://localhost:11434/v1
        tpm_limit: 0
        extra: {}
        models: {small: "gpt-oss:20b", strong: "gpt-oss:20b", fallback: "gpt-oss:20b"}
    embeddings: nomic-ai/nomic-embed-text-v1.5   # open, runs on CPU
    reranker: Xenova/ms-marco-MiniLM-L-12-v2     # open, 0.12 GB, fast on a laptop CPU (BAAI/bge-reranker-v2-m3 is 2.27 GB)

  # Optional profile: any API model, only where it beats "open" enough to pay for.
  paid:
    name: anthropic
    base_url: https://api.anthropic.com/v1
    api_key_env: ANTHROPIC_API_KEY
    models:
      small: openai/gpt-oss-20b          # cheap nodes stay on the open model
      strong: claude-sonnet-5-5
      fallback: openai/gpt-oss-20b
    tpm_limit: 0
    extra: {}
    embeddings: nomic-ai/nomic-embed-text-v1.5   # embeddings stay open in both profiles
    reranker: Xenova/ms-marco-MiniLM-L-12-v2

# Route by node: each agent names a model size, the profile decides the real model.
nodes:
  scout:       {model: small,  timeout_s: 20, retries: 2}
  analyst:     {model: small,  timeout_s: 30, retries: 2}
  risk:        {model: small,  timeout_s: 30, retries: 2}
  matcher:     {model: small,  timeout_s: 30, retries: 2}
  pricing:     {model: small,  timeout_s: 30, retries: 2}
  writer:      {model: strong, timeout_s: 60, retries: 1}
  verifier:    {model: small,  timeout_s: 45, retries: 2}
  critic:      {model: strong, timeout_s: 60, retries: 1}
  compliance:  {model: small,  timeout_s: 30, retries: 2}
  liaison:     {model: strong, timeout_s: 60, retries: 1}

# Retrieval (Part B). The app uses rag.variant; `make eval` compares all of them.
# Each variant is a list of steps. The code for each step is one file in rag/variants/.
rag:
  variant: keyword                        # the one the app uses (env GIGBID_RAG_VARIANT overrides). Set to the winner after `make eval`.
  evidence_types: [case, repo, review]    # what counts as proof of past work (not the CV, not old proposals)
  chunk_words: 120                        # V0: fixed chunk size in words
  chunk_overlap: 20
  candidates: 20                          # how many items the first search stage passes on
  rrf_k: 60                               # reciprocal rank fusion constant (V1 merge, V2 hybrid)
  outcome_boost: 0.3                      # V4: how much a project's past win/reply rate lifts its evidence
  corrective: {min_score: 0.3, min_keep: 1, max_requeries: 2}    # V8: grade evidence, re-query, refuse
  embed_prefix: {query: "search_query: ", document: "search_document: "}   # nomic models expect these; use "" for others
  variants:
    keyword:       [decompose, bm25]      # keyword search per requirement: what the app used before Part B
    v0_naive:      []                     # baseline: dense, fixed chunks, whole job post as the query
    v1_decompose:  [decompose]            # one search per requirement, then merge
    v2_hybrid:     [hybrid]               # BM25 + dense, reciprocal rank fusion
    v3_rerank:     [rerank]               # cross-encoder reorders the candidates
    v4_outcome:    [outcome]              # boost evidence from projects whose proposals won or got replies
    v8_corrective: [corrective]           # LangGraph loop: grade, re-query when weak, refuse when none
    best:          [decompose, hybrid, rerank, outcome, corrective]   # the ablation removes one step at a time

# Per-agent tool allowlists (A6): an agent can only call the tools named here.
# "sender" is not an agent: it is the step that runs only after a human approved.
tools:
  scout:      {marketplace: [search_jobs, get_job]}
  analyst:    {}
  risk:       {marketplace: [get_client_history]}
  matcher:    {portfolio: [search_evidence]}
  pricing:    {marketplace: [get_market_stats, get_connects_balance, get_policy]}
  writer:     {portfolio: [search_evidence, get_case_study]}
  verifier:   {}
  critic:     {portfolio: [search_evidence]}
  compliance: {}
  liaison:    {marketplace: [list_messages, list_events], workspace: [get_free_slots]}
  sender:     {marketplace: [create_proposal_draft, submit_proposal, send_message], workspace: [create_interview_hold]}
tool_call: {timeout_s: 15, retries: 2, backoff_s: 0.5}

# List prices in USD per 1 million tokens, [input, output], checked November 2026. Used only to
# report cost. A model that is not listed costs 0 (free tier variants, local Ollama).
prices_usd_per_mtok:
  groq:
    openai/gpt-oss-20b: [0.075, 0.30]
    openai/gpt-oss-120b: [0.15, 0.60]

# Long-term memory promotion rules (R7).
memory:
  style_promote_after: 2        # the same kind of edit must be seen this many times
  outcome_min_samples: 3        # proposals in a category before its reply rate is trusted

# Decision thresholds used by the "bid or skip?" node.
thresholds:
  fit_bid: 0.65          # fit score at or above this -> bid
  fit_watch: 0.45        # between watch and bid -> watch
  risk_block: 0.70       # risk score at or above this -> always skip
  min_evidence_items: 2  # fewer supported requirements than this -> skip

# Loop limits and per-thread budgets (exceeding either -> "needs attention").
limits:
  critic_max_revisions: 2
  step_budget: 40
  token_budget: 60000

# Declared budgets (reported against measured values in the R&D report).
budgets:
  p95_latency_s: {job_analysed: 20, proposal: 90}
  cost_usd: {job_analysed: 0.002, proposal: 0.02}

# Marketplace rules. The change request ("platform policy update") lands here.
rules:
  connects:
    weekly_budget_default: 60
    cost_per_proposal_default: 4     # used only if the marketplace does not say
    max_cost_per_proposal: 16        # never spend more than this on one job
  proposal:
    max_words: 250
    min_words: 80
  policy_pack_dir: data/policy_pack
  banned_phrases: ["guarantee", "100% satisfaction", "whatsapp", "telegram", "pay outside"]

# Autonomy: may auto-skip low-fit jobs, can never auto-send.
autonomy:
  auto_skip_low_fit: true
  auto_send: false       # must stay false; the code refuses to start if true
