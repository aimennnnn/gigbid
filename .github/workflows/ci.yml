# Runs on every pull request and on every push to main.
# No API key and no network model: GIGBID_LLM=fake and GIGBID_RAG_MODELS=fake use the stand-ins.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: lint, tests, smoke eval, eval gates
    runs-on: ubuntu-latest
    env:
      GIGBID_LLM: fake
      GIGBID_RAG_MODELS: fake
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (same versions as uv.lock)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Unit, integration and MCP contract tests
        run: uv run pytest -q
      - name: 30-job smoke eval (stand-in models)
        run: uv run python -m evals.runners.run_all --smoke
      - name: Gate on the smoke eval (bid-or-skip F1, unsupported claims, leaked code words, failed jobs)
        run: uv run python -m evals.runners.gate --smoke
      - name: Gate on the committed real-model results
        run: uv run python -m evals.runners.gate

  web:
    name: web build, type check, Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install, type check and build the web app
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: The committed TypeScript client matches the API
        run: |
          GIGBID_LLM=fake uv run python -m apps.api.openapi
          cd apps/web && npm run gen:api && git diff --exit-code -- openapi.json src/lib/api/schema.d.ts
      - name: End-to-end UI tests (Chrome; the config starts the API with stand-in models)
        working-directory: apps/web
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
